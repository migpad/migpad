# git-cliff: CHANGELOG.md from the commits of main, which follow Conventional Commits.
# git cliff --tag vX.Y.Z -o CHANGELOG.md — https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

What changed in each version of MigPad. MigPad follows [Semantic Versioning](https://semver.org/).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# The number of the pull request of a squashed commit, as a link.
commit_preprocessors = [
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/migpad/migpad/pull/${1}))" },
]
# What a user of MigPad notices; the rest — tests, CI, refactoring — stays out.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^build", group = "<!-- 3 -->Build" },
    { message = ".*", skip = true },
]
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"

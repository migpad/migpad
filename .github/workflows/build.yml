name: Release

# The packages of MigPad for macOS, Windows and Linux. A tag vX.Y.Z makes a draft release with
# them, which a maintainer publishes; run by hand, it makes the packages of a branch as artifacts.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  licenses:
    name: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: licenses
      - run: cargo install cargo-about --version 0.9.2 --locked
      # The sources of the crates of every platform, whose license files cargo-about reads.
      - run: cargo fetch --locked
      - run: cargo about generate --workspace --locked --fail -o THIRD-PARTY-LICENSES.html script/licenses.hbs
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.html

  macos:
    name: macOS
    needs: licenses
    runs-on: macos-latest
    env:
      # Without the secrets of signing — in forks, before they are set — the app is signed ad hoc.
      SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Ensure the Metal toolchain
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: rustup toolchain install && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
          path: target
      - name: Import the certificate of signing
        if: env.SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -base64 24)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -m 1 'Developer ID Application' | sed 's/.*"\(.*\)"/\1/')
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/api-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/api-key.p8" >> "$GITHUB_ENV"
      - run: script/bundle-macos
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Check the app
        run: |
          app=target/bundle/MigPad.app
          lipo -info "$app/Contents/MacOS/migpad"
          "$app/Contents/MacOS/migpad" --version
          arch -x86_64 "$app/Contents/MacOS/migpad" --version
          if [[ $SIGNING == true ]]; then
            spctl --assess --type execute -vv "$app"
            xcrun stapler validate target/bundle/MigPad.dmg
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/bundle/MigPad.dmg

  windows-build:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-2025
          - arch: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --release --locked -p migpad
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-exe
          path: target/release/migpad.exe

  windows:
    name: Windows packages
    needs: [licenses, windows-build]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
          path: target
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*-exe
          path: target/exe
      - run: |
          script\bundle-windows.ps1 -Arch x64 -Exe target\exe\windows-x64-exe\migpad.exe
          script\bundle-windows.ps1 -Arch arm64 -Exe target\exe\windows-arm64-exe\migpad.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/bundle/MigPad-*-setup.exe
            target/bundle/MigPad-*-portable.zip

  linux:
    name: Linux ${{ matrix.arch }}
    needs: licenses
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04: glibc 2.35, which the packages need at least.
          - arch: x86_64
            os: ubuntu-22.04
            appimagetool: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            runtime: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - arch: aarch64
            os: ubuntu-22.04-arm
            appimagetool: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            runtime: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the dependencies of the build and of the packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig-dev libfreetype-dev \
            libxcb1-dev libxkbcommon-x11-dev dpkg-dev rpm desktop-file-utils appstream
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --release --locked -p migpad
      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
          path: target
      - name: Download appimagetool and the runtime of AppImages
        run: |
          base=https://github.com/AppImage
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" "$base/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.arch }}.AppImage"
          curl -fsSL -o "$RUNNER_TEMP/runtime" "$base/type2-runtime/releases/download/20251108/runtime-${{ matrix.arch }}"
          echo "${{ matrix.appimagetool }}  $RUNNER_TEMP/appimagetool" | sha256sum --check
          echo "${{ matrix.runtime }}  $RUNNER_TEMP/runtime" | sha256sum --check
          chmod +x "$RUNNER_TEMP/appimagetool"
      - run: script/bundle-linux
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          APPIMAGE_RUNTIME: ${{ runner.temp }}/runtime
      - name: Check the packages
        run: |
          root=target/bundle/linux/root
          desktop-file-validate $root/usr/share/applications/com.migpad.MigPad.desktop
          appstreamcli validate --no-net --explain $root/usr/share/metainfo/com.migpad.MigPad.metainfo.xml
          ldd target/release/migpad
          deb=$(ls target/bundle/*.deb) rpm=$(ls target/bundle/*.rpm) appimage=$(ls target/bundle/*.AppImage)
          dpkg-deb --info "$deb"
          rpm -qp --requires "$rpm"
          # Installed where they are meant for, the packages bring what MigPad needs: it starts.
          for image in ubuntu:22.04 ubuntu:24.04 debian:12; do
            docker run --rm -v "$PWD/target/bundle:/bundle" "$image" sh -c \
              "apt-get update -qq && apt-get install -y -qq /bundle/$(basename "$deb") > /dev/null && migpad --version"
          done
          docker run --rm -v "$PWD/target/bundle:/bundle" fedora:latest sh -c \
            "dnf install -y -q /bundle/$(basename "$rpm") > /dev/null && migpad --version"
          chmod +x "$appimage"
          "$appimage" --appimage-extract-and-run --version
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            target/bundle/*.deb
            target/bundle/*.rpm
            target/bundle/*.AppImage

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The packages, without the builds of migpad.exe the Windows packages are made of.
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # The notes are the section of the version in the changelog.
          awk -v version="$version" '
            /^## / { if (found) exit; found = index($0, "[" version "]") > 0; next }
            found
          ' CHANGELOG.md > notes.md
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "MigPad $version" --notes-file notes.md dist/*

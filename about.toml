# cargo-about: the file of the licenses of the components MigPad is built from, which its packages
# carry (THIRD-PARTY-LICENSES.html). CI makes it with the template script/licenses.hbs.
# https://embarkstudios.github.io/cargo-about/

# The licenses deny.toml allows, in the order of choice for a crate under several: MIT first, as
# MigPad's own.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "bzip2-1.0.6",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
# The platforms MigPad ships on.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# What only builds MigPad or tests it is not in the packages.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The crates of MigPad itself: its own license is LICENSE.
[private]
ignore = true

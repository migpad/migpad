# Strings of the interface in English, the base language. The keys are grouped by where the
# strings show; ru.toml has the same keys, or the build fails.
#
# In the strings of menus "&" marks the mnemonic, the letter that opens the menu or chooses the
# item with Alt on Windows and Linux; "&&" is an ampersand. A placeholder such as "{count}" takes
# a value; a string has the same placeholders in each table.

[app]
services = "Services"
hide = "Hide MigPad"
hide_others = "Hide Others"
show_all = "Show All"
quit = "Quit MigPad"
exit = "E&xit"

[file]
menu = "&File"
new = "&New"
new_window = "New &Window"
open = "&Open…"
reopen_closed = "Reopen Closed &Tab"
save = "&Save"
save_as = "Save &As…"
close_tab = "&Close Tab"
close_window = "Close Win&dow"
untitled = "Untitled"
# The button of the dialog that opens files.
open_button = "Open"
recent = "&Recent Files"
recently_closed = "Recent&ly Closed"
clear_recent = "&Clear List"
no_recent = "No Recent Files"
no_closed = "Nothing Closed Lately"
# A recent file in the menu: its name, then its folder.
recent_label = "{name} — {folder}"
# A closed window in the menu, by the names of its tabs.
closed_window = "Window: {tabs}"
# The tooltip of a tab whose file another program removed.
missing = "{path} — not on disk any more"

[edit]
menu = "&Edit"
undo = "&Undo"
redo = "&Redo"
cut = "Cu&t"
copy = "&Copy"
paste = "&Paste"
select_all = "Select &All"

[find]
# The submenu of the Edit menu on macOS.
menu = "&Find"
find = "&Find…"
# Replace… on Windows and Linux, Find and Replace… on macOS.
replace = "R&eplace…"
find_and_replace = "Find and R&eplace…"
next = "Find &Next"
previous = "Find Pre&vious"
# The find bar over the text.
placeholder = "Find"
replace_placeholder = "Replace with"
match_case = "Match Case"
whole_word = "Whole Word"
regex = "Regular Expression"
replace_one = "Replace"
replace_all = "Replace All"
close = "Close"
# The match found is the {index}-th of {total}.
found = "{index} of {total}"
found_from_top = "{index} of {total}, from the top"
found_from_bottom = "{index} of {total}, from the bottom"
counting = "Counting…"
not_found = "No results"
invalid = "Invalid expression: {reason}"
replacing = "Replacing… {percent}"
replaced = "Replaced: {count}"

[go_to]
line = "&Go to Line…"
# The hint of the field, with the number of lines of the document.
placeholder = "Line, or line:column (1–{count})"
invalid = "A line, or a line and a column: 120 or 120:15"
close = "Close"

[view]
menu = "&View"
word_wrap = "&Word Wrap"
invisibles = "&Invisibles"
indent_guides = "Indent &Guides"
# On macOS: the menu bar of Windows and Linux in each window.
menu_bar = "&Menu Bar in Window"

[window]
menu = "&Window"
minimize = "Minimize"
zoom = "Zoom"
next_tab = "&Next Tab"
previous_tab = "&Previous Tab"
select_tab = "Select Tab"

[close]
question = "Save the changes to “{file}”?"
detail = "If you don't save them, your changes will be lost."
window_question = "Save the changes to the documents of this window?"
window_detail = "Documents with changes: {files}. If you don't save them, your changes will be lost."
quit_question = "Save the changes before quitting?"
quit_detail = "No journal keeps the changes to {files}: if you don't save them, they will be lost."
# A document in the list of window_detail.
file = "“{file}”"
save = "Save"
save_all = "Save All"
dont_save = "Don't Save"
cancel = "Cancel"

[status]

# Strings of the interface in English, the base language. The keys are grouped by where the
# strings show; ru.toml has the same keys, or the build fails.
#
# In the strings of menus "&" marks the mnemonic, the letter that opens the menu or chooses the
# item with Alt on Windows and Linux; "&&" is an ampersand. A placeholder such as "{count}" takes
# a value; a string has the same placeholders in each table.

[app]
services = "Services"
hide = "Hide MigPad"
hide_others = "Hide Others"
show_all = "Show All"
quit = "Quit MigPad"
exit = "E&xit"

[file]
menu = "&File"
new = "&New"
new_window = "New &Window"
open = "&Open…"
reopen_closed = "Reopen Closed &Tab"
save = "&Save"
save_as = "Save &As…"
close_tab = "&Close Tab"
close_window = "Close Win&dow"
untitled = "Untitled"
# The button of the dialog that opens files.
open_button = "Open"
recent = "&Recent Files"
recently_closed = "Recent&ly Closed"
clear_recent = "&Clear List"
no_recent = "No Recent Files"
no_closed = "Nothing Closed Lately"
# A recent file in the menu: its name, then its folder.
recent_label = "{name} — {folder}"
# A closed window in the menu, by the names of its tabs.
closed_window = "Window: {tabs}"
# The tooltip of a tab whose file another program removed.
missing = "{path} — not on disk any more"

[edit]
menu = "&Edit"
undo = "&Undo"
redo = "&Redo"
cut = "Cu&t"
copy = "&Copy"
paste = "&Paste"
select_all = "Select &All"

[view]
menu = "&View"
word_wrap = "&Word Wrap"
invisibles = "&Invisibles"
indent_guides = "Indent &Guides"

[window]
menu = "&Window"
minimize = "Minimize"
zoom = "Zoom"
next_tab = "&Next Tab"
previous_tab = "&Previous Tab"
select_tab = "Select Tab"

[close]

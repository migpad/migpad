<svg xmlns="http://www.w3.org/2000/svg" width="888" height="888" viewBox="68 68 888 888">
  <!-- The icon of MigPad: an M whose last stroke is a caret. The body follows the grid of macOS
       icons, 824 × 824 at 100, 100; script/icons.swift makes the icons of the packages from it. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3d6e"/>
      <stop offset="1" stop-color="#101b3a"/>
    </linearGradient>
    <linearGradient id="caret" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6aa6ff"/>
      <stop offset="1" stop-color="#2f6fde"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="10">
    <line x1="210" y1="760" x2="814" y2="760"/>
    <line x1="210" y1="820" x2="814" y2="820"/>
  </g>
  <path d="M300 700 V330 L512 575 L724 330" fill="none" stroke="#ffffff" stroke-width="100"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="674" y="280" width="100" height="470" rx="50" fill="url(#caret)"/>
</svg>

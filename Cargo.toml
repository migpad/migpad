[workspace]
members = ["crates/*"]
# Copies of crates with fixes of MigPad: see vendor/README.md.
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.1.2-dev"
edition = "2024"
license = "MIT"
repository = "https://github.com/migpad/migpad"
publish = false

[workspace.dependencies]
migpad-core = { path = "crates/migpad-core" }
migpad-editor = { path = "crates/migpad-editor" }
migpad-ui = { path = "crates/migpad-ui" }

# GPUI, the UI framework of the Zed editor: community snapshot gpui-pre 0.3.7 (zed@1a28cff), pinned exactly.
gpui = { package = "gpui-pre", version = "=0.3.7" }
# Without `font-kit` there is no text on macOS; without `wayland` and `x11` there is no window on Linux.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["font-kit", "wayland", "x11"] }

# macOS: blocks of Objective-C, for the system calls that take them; GPUI has this version too.
block2 = "0.6"
chardetng = "1.0"
# Windows: the resources of migpad.exe, at build time; GPUI has this version too.
embed-resource = "3.0"
encoding_rs = "0.8.42"
# The width of the text of Mermaid diagrams in the fonts of the system, as resvg draws it: the fonts, and the shaping
# of text. GPUI has these versions too, through resvg: no new packages.
fontdb = "0.23"
# Linux: the icon of the windows, which X11 takes from the window; GPUI has this version too.
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
memchr = "2.8"
# Mermaid diagrams of the Markdown preview as SVG: Mermaid.js rewritten in Rust. Only the diagrams of the preview,
# and the ELK layout (EPL-2.0), which lays out the graphs more tidily than dagre.
merman = { version = "0.9", default-features = false, features = [
    "svg",
    "layout-elk",
    "diagram-class",
    "diagram-er",
    "diagram-flowchart",
    "diagram-gantt",
    "diagram-git-graph",
    "diagram-journey",
    "diagram-mindmap",
    "diagram-pie",
    "diagram-sequence",
    "diagram-state",
    "diagram-timeline",
] }
# macOS: the context menus of the system, the appearance of what it draws, the settings window, the About panel,
# MigPad as the program of texts. GPUI uses these versions too: no new packages.
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSAppearance",
    "NSApplication",
    "NSAttributedString",
    "NSBox",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSFontManager",
    "NSGraphics",
    "NSGridView",
    "NSLayoutAnchor",
    "NSLayoutConstraint",
    "NSMenu",
    "NSMenuItem",
    "NSParagraphStyle",
    "NSPopUpButton",
    "NSResponder",
    "NSScreen",
    "NSStackView",
    "NSStepper",
    "NSText",
    "NSTextField",
    "NSUserInterfaceLayout",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "std",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSDictionary",
    "NSGeometry",
    "NSString",
    "NSURL",
    "std",
] }
# macOS: the window of the system behind a window of GPUI; GPUI has this version too.
raw-window-handle = "0.6"
base64 = "0.22"
bs58 = "0.5"
percent-encoding = "2.3"
# Markdown of the preview: CommonMark, tables, strikethrough, task lists; without the output to HTML.
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.13"
rustybuzz = "0.20"
# The settings of the Mermaid diagrams, for merman; GPUI and merman have this version too: no new packages.
serde_json = "1.0"
# SHA-256 and SHA-512 of the selected text (RustCrypto).
sha2 = "0.10"
# The language of the system.
sys-locale = "0.3"
# TOML: the tables of interface strings, at build time and translations of the user; the settings and the state
# the program keeps between starts.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
windows-sys = "0.61"

# GPUI on Linux and Windows with fixes of MigPad: see vendor/README.md.
[patch.crates-io]
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.release]
lto = "thin"
